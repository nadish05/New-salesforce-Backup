<template>
    <lightning-card title="Deployment History Details" icon-name="standard:product_transfer">
        <div class="slds-p-around_medium">
            <template if:true={errorMessage}>
                <div class="slds-text-color_error" role="alert">{errorMessage}</div>
            </template>

            <template if:false={errorMessage}>
                <template if:false={hasContent}>
                    <p class="slds-text-body_regular slds-text-color_weak">
                        No detail sections are available for this record yet.
                    </p>
                </template>

                <template if:true={hasTimeline}>
                    <section class="slds-m-bottom_large">
                        <h3 class="slds-text-heading_small slds-m-bottom_small">Timeline</h3>
                        <ol class="slds-list_ordered">
                            <template for:each={timelineItems} for:item="item">
                                <li key={item.id} class="slds-m-bottom_x-small">
                                    <div class="slds-grid slds-gutters_x-small slds-wrap">
                                        <div class="slds-col slds-grow">
                                            <span class="slds-text-title_bold">✓ {item.stage}</span>
                                        </div>
                                        <div class="slds-col slds-shrink-none slds-text-body_small slds-text-color_weak">
                                            {item.timestamp}
                                        </div>
                                    </div>
                                </li>
                            </template>
                        </ol>
                    </section>
                </template>

                <template if:true={hasDeploymentSummary}>
                    <section class="slds-m-bottom_large">
                        <h3 class="slds-text-heading_small slds-m-bottom_small">Deployment Summary</h3>
                        <dl class="slds-dl_horizontal">
                            <template for:each={deploymentSummaryRows} for:item="row">
                                <div key={row.id} class="dh-row">
                                    <dt class="slds-dl_horizontal__label">
                                        <p class="slds-truncate">{row.label}</p>
                                    </dt>
                                    <dd class="slds-dl_horizontal__detail">{row.value}</dd>
                                </div>
                            </template>
                        </dl>
                    </section>
                </template>

                <template if:true={hasValidationSummary}>
                    <section class="slds-m-bottom_large">
                        <h3 class="slds-text-heading_small slds-m-bottom_small">Validation Summary</h3>
                        <dl class="slds-dl_horizontal">
                            <template for:each={validationSummaryRows} for:item="row">
                                <div key={row.id} class="dh-row">
                                    <dt class="slds-dl_horizontal__label">
                                        <p class="slds-truncate">{row.label}</p>
                                    </dt>
                                    <dd class="slds-dl_horizontal__detail">{row.value}</dd>
                                </div>
                            </template>
                        </dl>
                    </section>
                </template>

                <template if:true={hasTestResults}>
                    <section class="slds-m-bottom_large">
                        <h3 class="slds-text-heading_small slds-m-bottom_small">Test Results</h3>
                        <dl class="slds-dl_horizontal">
                            <template for:each={testResultRows} for:item="row">
                                <div key={row.id} class="dh-row">
                                    <dt class="slds-dl_horizontal__label">
                                        <p class="slds-truncate">{row.label}</p>
                                    </dt>
                                    <dd class="slds-dl_horizontal__detail">{row.value}</dd>
                                </div>
                            </template>
                        </dl>

                        <template if:true={hasFailingTests}>
                            <h4 class="slds-text-title_caps slds-m-top_medium slds-m-bottom_x-small">
                                Failing Tests
                            </h4>
                            <ul class="slds-list_dotted">
                                <template for:each={failingTests} for:item="test">
                                    <li key={test.id} class="slds-m-bottom_x-small">
                                        <strong>{test.className}.{test.methodName}</strong>
                                        <div class="slds-text-body_small slds-text-color_weak">
                                            {test.message}
                                        </div>
                                    </li>
                                </template>
                            </ul>
                        </template>
                    </section>
                </template>

                <template if:true={hasCliCompatibility}>
                    <section>
                        <h3 class="slds-text-heading_small slds-m-bottom_small">CLI Compatibility</h3>
                        <dl class="slds-dl_horizontal">
                            <template for:each={cliCompatibilityRows} for:item="row">
                                <div key={row.id} class="dh-row">
                                    <dt class="slds-dl_horizontal__label">
                                        <p class="slds-truncate">{row.label}</p>
                                    </dt>
                                    <dd class="slds-dl_horizontal__detail">{row.value}</dd>
                                </div>
                            </template>
                        </dl>
                    </section>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
