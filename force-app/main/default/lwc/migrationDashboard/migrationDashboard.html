<template>
    <div class="page-container">


        <!-- ═══════════════════════════════════════════════════════════════ -->
        <!-- PHASE 1 — GLOBAL WORKSPACE HEADER                              -->
        <!-- Replaces: view-header + ctrl-bar (both removed from sub-views) -->
        <!-- Check Backend moved here from Backup view                      -->
        <!-- ═══════════════════════════════════════════════════════════════ -->
        <header class="ws-header">

            <div class="ws-header-brand">
                <div class="ws-brand-mark"></div>
                <div class="ws-brand-text">
                    <span class="ws-brand-title">Metadata Comparison Platform</span>
                    <span class="ws-brand-sub">Org Consolidation Workspace</span>
                </div>
            </div>

            <!-- Comparison selector — only shown in comparison view -->
            <template if:true={isComparisonView}>
                <div class="ws-header-selector">
                    <lightning-combobox
                        label="Select a comparison"
                        variant="label-hidden"
                        value={selectedComparison}
                        options={comparisonOptions}
                        onchange={handleComparisonSelect}
                        placeholder="Select a comparison..."
                        disabled={isComparisonSelectorDisabled}
                        aria-disabled={isComparisonSelectorDisabled}>
                    </lightning-combobox>
                </div>
            </template>

            <div class="ws-header-actions">
                <!-- Comparison actions — only in comparison view -->
                <template if:true={isComparisonView}>
                    <lightning-button
                        label="New Comparison"
                        variant="brand"
                        onclick={openNewComparisonModal}
                        disabled={isNewComparisonDisabled}>
                    </lightning-button>
                    <lightning-button
                        label="Connect Org"
                        variant="neutral"
                        onclick={openConnectOrgModal}
                        disabled={isConnectOrgDisabled}>
                    </lightning-button>
                </template>

                <!-- Check Backend — always visible, moved from Backup view -->
                <div class="ws-backend-cluster">
                    <lightning-button
                        label="Check Backend"
                        variant="neutral"
                        onclick={checkConnection}>
                    </lightning-button>
                    <template if:true={backendStatus}>
                        <span class="ws-backend-pill" role="status" aria-live="polite">{backendStatus}</span>
                    </template>
                </div>
            </div>

        </header>


        <!-- ═══════════════════════════════════════════════════════════════ -->
        <!-- PHASE 1 — WORKSPACE NAV TABS                                   -->
        <!-- Default: Comparison. Backup accessible via tab.                -->
        <!-- ═══════════════════════════════════════════════════════════════ -->
        <nav class="ws-nav">
            <button
                class={comparisonTabClass}
                onclick={goToComparison}>
                Metadata Comparison
            </button>
           <!-- <button 
                class={backupTabClass}
                onclick={goToBackup}>
                Org Metadata Backup
            </button> -->
        </nav>


        <!-- ═══════════════════════════════════════════════════════════════ -->
        <!-- BACKUP VIEW — unchanged content, no header/back-btn            -->
        <!-- ═══════════════════════════════════════════════════════════════ -->
        <template if:true={isBackupView}>
            <div class="view-body">

                <div class="section-card">
                    <div class="section-card-header">
                        <span class="section-card-title">Connect New Org</span>
                    </div>
                    <div class="section-card-body">
                        <div class="form-grid">
                            <lightning-input label="Connected Org Name" value={orgDisplayName} onchange={handleOrgDisplayNameChange}></lightning-input>
                            <lightning-combobox label="Environment" value={environment} options={environmentOptions} onchange={handleEnvironmentChange}></lightning-combobox>
                        </div>
                        <div class="form-actions">
                            <lightning-button label="Connect New Org" variant="brand" onclick={connectNewOrg}></lightning-button>
                        </div>
                    </div>
                </div>

                <div class="section-card">
                    <div class="section-card-header">
                        <span class="section-card-title">Start Backup</span>
                    </div>
                    <div class="section-card-body">
                        <div class="form-grid">
                            <lightning-combobox label="Connected Org" value={selectedOrg} options={orgOptions} onchange={handleOrgChange}></lightning-combobox>
                            <lightning-input label="GitHub Repository URL" value={githubUrl} onchange={handleGithubRepoChange}></lightning-input>
                        </div>
                        <div class="form-actions">
                            <lightning-button label="Start Migration" variant="success" onclick={handleStartMigration}></lightning-button>
                        </div>
                    </div>
                </div>

            </div>
        </template>


        <!-- ═══════════════════════════════════════════════════════════════ -->
        <!-- COMPARISON WORKSPACE                                            -->
        <!-- ═══════════════════════════════════════════════════════════════ -->
        <template if:true={isComparisonView}>
            <div class="view-body">


                <!-- ═══════════════════════════════════════════════════════ -->
                <!-- ORG CONSOLIDATION LIFECYCLE RAIL                        -->
                <!-- Navigation via activeLifecycleStage.                    -->
                <!-- Stages 1–3 also open existing action modals.            -->
                <!-- Stages 3–6 workspaces hold relocated feature UI.        -->
                <!-- ═══════════════════════════════════════════════════════ -->
                <section class="lifecycle-rail" aria-label="Org consolidation lifecycle, 6 stages">
                    <div class="lifecycle-rail-header">
                        <div class="lifecycle-rail-label" id="lifecycle-rail-heading">Org Consolidation Lifecycle</div>
                        <div class="lifecycle-rail-badges">
                            <span class="lc-progress-badge" aria-live="polite">{lifecycleCompletionLabel}</span>
                            <span class="lc-phase-badge" aria-live="polite">{lifecyclePhaseLabel}</span>
                        </div>
                    </div>

                    <div class="lifecycle-stages" role="group" aria-labelledby="lifecycle-rail-heading">

                        <!-- Stage 1: Org Connection -->
                        <button
                            class={stage1Class}
                            data-stage="1"
                            onclick={handleLifecycleStageClick}
                            disabled={stage1Disabled}
                            title="Org Connection"
                            aria-label="Stage 1 of 6: Org Connection"
                            aria-describedby="stage1-status">
                            <span class="lc-node-number">1</span>
                            <span class="lc-node-icon" aria-hidden="true">🔗</span>
                            <span class="lc-node-label">Org Connection</span>
                            <span id="stage1-status" class={stage1StatusClass}>{stage1StatusLabel}</span>
                        </button>

                        <div class={connector1Class}></div>

                        <!-- Stage 2: Metadata Retrieval -->
                        <button
                            class={stage2Class}
                            data-stage="2"
                            onclick={handleLifecycleStageClick}
                            disabled={stage2Disabled}
                            title="Metadata Retrieval"
                            aria-label="Stage 2 of 6: Metadata Retrieval"
                            aria-describedby="stage2-status">
                            <span class="lc-node-number">2</span>
                            <span class="lc-node-icon" aria-hidden="true">📥</span>
                            <span class="lc-node-label">Metadata Retrieval</span>
                            <span id="stage2-status" class={stage2StatusClass}>{stage2StatusLabel}</span>
                        </button>

                        <div class={connector2Class}></div>

                        <!-- Stage 3: Metadata Comparison -->
                        <button
                            class={stage3Class}
                            data-stage="3"
                            onclick={handleLifecycleStageClick}
                            disabled={stage3Disabled}
                            title="Metadata Comparison"
                            aria-label="Stage 3 of 6: Metadata Comparison"
                            aria-describedby="stage3-status">
                            <span class="lc-node-number">3</span>
                            <span class="lc-node-icon" aria-hidden="true">⚖️</span>
                            <span class="lc-node-label">Metadata Comparison</span>
                            <span id="stage3-status" class={stage3StatusClass}>{stage3StatusLabel}</span>
                        </button>

                        <div class={connector3Class}></div>

                        <!-- Stage 4: Dependency Review -->
                        <button
                            class={stage4Class}
                            data-stage="4"
                            onclick={handleLifecycleStageClick}
                            disabled={stage4Disabled}
                            title="Dependency Review"
                            aria-label="Stage 4 of 6: Dependency Review"
                            aria-describedby="stage4-status">
                            <span class="lc-node-number">4</span>
                            <span class="lc-node-icon" aria-hidden="true">🔍</span>
                            <span class="lc-node-label">Dependency Review</span>
                            <span id="stage4-status" class={stage4StatusClass}>{stage4StatusLabel}</span>
                        </button>

                        <div class={connector4Class}></div>

                        <!-- Stage 5: Deployment Planning -->
                        <button
                            class={stage5Class}
                            data-stage="5"
                            onclick={handleLifecycleStageClick}
                            disabled={stage5Disabled}
                            title="Deployment Planning"
                            aria-label="Stage 5 of 6: Deployment Planning"
                            aria-describedby="stage5-status">
                            <span class="lc-node-number">5</span>
                            <span class="lc-node-icon" aria-hidden="true">📋</span>
                            <span class="lc-node-label">Deployment Planning</span>
                            <span id="stage5-status" class={stage5StatusClass}>{stage5StatusLabel}</span>
                        </button>

                        <div class={connector5Class}></div>

                        <!-- Stage 6: Deployment Execution -->
                        <button
                            class={stage6Class}
                            data-stage="6"
                            onclick={handleLifecycleStageClick}
                            disabled={stage6Disabled}
                            title="Deployment Execution"
                            aria-label="Stage 6 of 6: Deployment Execution"
                            aria-describedby="stage6-status">
                            <span class="lc-node-number">6</span>
                            <span class="lc-node-icon" aria-hidden="true">🚀</span>
                            <span class="lc-node-label">Deployment Execution</span>
                            <span id="stage6-status" class={stage6StatusClass}>{stage6StatusLabel}</span>
                        </button>

                    </div>
                </section>


                <!-- ══════════════════════════════════════════════════════ -->
                <!-- PHASE 1–5 — STAGE WORKSPACES (complete lifecycle UI)   -->
                <!-- Stage 3: Metadata Comparison                           -->
                <!-- Stage 4: Deployment Review + Source Validation         -->
                <!-- Stage 5: Deployment Validation + Planner + Readiness   -->
                <!-- Stage 6: Deployment Execution                          -->
                <!-- ══════════════════════════════════════════════════════ -->
                <section class="lifecycle-workspace">

                    <template if:true={isStage1Workspace}>
                        <div class="section-card">
                            <div class="section-card-header">
                                <span class="section-card-title">Org Connection</span>
                            </div>
                            <div class="section-card-body">
                                <p class="lifecycle-rail-label" style="margin-bottom:0.5rem;">Stage 1 of 6</p>
                                <p class="slds-text-body_regular slds-text-color_weak">
                                    Connect the source and destination Salesforce orgs that will take part in this
                                    consolidation. Use <strong>Connect Org</strong> in the workspace header above to
                                    authenticate an org, then move on to Stage 2 to retrieve its metadata.
                                </p>
                            </div>
                        </div>
                    </template>

                    <template if:true={isStage2Workspace}>
                        <div class="section-card">
                            <div class="section-card-header">
                                <span class="section-card-title">Metadata Retrieval</span>
                            </div>
                            <div class="section-card-body">
                                <p class="lifecycle-rail-label" style="margin-bottom:0.5rem;">Stage 2 of 6</p>
                                <p class="slds-text-body_regular slds-text-color_weak">
                                    Pull the latest metadata from each connected org into its GitHub branch so it can
                                    be compared. Open this stage's node above to start retrieval for the source and
                                    destination orgs.
                                </p>
                            </div>
                        </div>
                    </template>

                    <template if:true={isStage3Workspace}>

                        <p class="lifecycle-rail-label" style="margin-bottom:0.35rem;">Stage 3 of 6</p>
                        <p class="slds-text-body_regular slds-text-color_weak slds-m-bottom_medium">
                            Compare the retrieved metadata between the source and destination branches. Review what's
                            added, modified, or missing below, then select the files to carry forward before creating
                            a deployment plan.
                        </p>

                        <template if:false={selectedComparisonDetails}>
                            <div class="ux-empty-state" role="status" aria-live="polite">
                                <lightning-icon
                                    icon-name="utility:sync"
                                    size="large"
                                    alternative-text=""
                                    class="ux-empty-state-icon">
                                </lightning-icon>
                                <h2 class="ux-empty-state-title">No comparison loaded</h2>
                                <p class="ux-empty-state-body">
                                    Select a comparison from the header, or open Stage 3 to compare metadata and generate an AI summary.
                                </p>
                            </div>
                        </template>

                        <!-- PHASE 2 — Metadata Comparison workspace (relocated HTML only) -->
                        <template if:true={selectedComparisonDetails}>

                        <!-- ── Comparison Overview Card ── -->
                        <div class="cmp-header-card">
                            <div class="cmp-header-left">
                                <div class="cmp-header-name">{selectedComparisonDetails.Name}</div>
                                <div class="cmp-header-orgs">
                                    <span class="cmp-org-chip source-chip">{sourceOrgName}</span>
                                    <span class="cmp-arrow">→</span>
                                    <span class="cmp-org-chip dest-chip">{destinationOrgName}</span>
                                </div>
                            </div>
                            <div class="cmp-header-right">
                                <div class="cmp-kpi-item">
                                    <div class="cmp-kpi-value">{totalDiffCount}</div>
                                    <div class="cmp-kpi-label">Total Differences</div>
                                </div>
                            </div>
                        </div>

                        <!-- ── KPI Cards ── -->
                        <template if:true={groupedComparisonResults}>
                            <div class="kpi-grid">
                                <div class="kpi-card kpi-added">
                                    <div class="kpi-card-count">{kpiAdded}</div>
                                    <div class="kpi-card-label">Added</div>
                                    <div class="kpi-card-sub">In Source Only</div>
                                </div>
                                <div class="kpi-card kpi-modified">
                                    <div class="kpi-card-count">{kpiModified}</div>
                                    <div class="kpi-card-label">Modified</div>
                                    <div class="kpi-card-sub">Content Differs</div>
                                </div>
                                <div class="kpi-card kpi-deleted">
                                    <div class="kpi-card-count">{kpiDeleted}</div>
                                    <div class="kpi-card-label">Missing</div>
                                    <div class="kpi-card-sub">In Destination Only</div>
                                </div>
                                <div class="kpi-card kpi-total">
                                    <div class="kpi-card-count">{savedComparisonResults.length}</div>
                                    <div class="kpi-card-label">Total Files</div>
                                    <div class="kpi-card-sub">Scanned</div>
                                </div>
                            </div>
                        </template>

                        <!-- AI Analysis command surface — existing controls/state, relocated only -->
                        <section
                            class="stage3-ai-command"
                            aria-labelledby="stage3-ai-command-heading">
                            <div class="stage3-ai-command__intro">
                                <div class="stage3-ai-command__heading-row">
                                    <span class="stage3-ai-command__icon">
                                        <lightning-icon
                                            icon-name="utility:einstein"
                                            size="small"
                                            alternative-text="">
                                        </lightning-icon>
                                    </span>
                                    <div>
                                        <p class="stage3-ai-command__eyebrow">AI Analysis</p>
                                        <h2
                                            id="stage3-ai-command-heading"
                                            class="stage3-ai-command__title">
                                            Generate Comparison Insights
                                        </h2>
                                    </div>
                                </div>
                                <p class="stage3-ai-command__description">
                                    Generate an AI-powered summary of the metadata differences
                                    using your preferred model.
                                </p>
                            </div>
                            <div class="stage3-ai-command__controls">
                                <div class="stage3-ai-command__model">
                                    <lightning-combobox
                                        name="selectedModel"
                                        label="AI Model"
                                        value={selectedModel}
                                        options={modelOptions}
                                        onchange={handleModelChange}>
                                    </lightning-combobox>
                                </div>
                                <div class="stage3-ai-command__action">
                                    <lightning-button
                                        label="Generate AI Summary"
                                        variant="brand"
                                        onclick={generateAISummary}>
                                    </lightning-button>
                                </div>
                            </div>
                        </section>

                        <!-- ── AI Summary (existing single presentation surface) ── -->
                        <template if:true={aiSummary}>
                            <div
                                data-id="comparison-ai-summary"
                                class="comparison-ai-summary-anchor ai-report"
                                aria-label="AI Comparison Summary">

                                <article class="ai-report-card">
                                    <header class="ai-report-header">
                                        <div class="ai-report-header-main">
                                            <div class="ai-report-title-row">
                                                <lightning-icon
                                                    icon-name="utility:einstein"
                                                    size="small"
                                                    alternative-text=""
                                                    class="ai-report-title-icon">
                                                </lightning-icon>
                                                <h2 class="ai-report-title">AI Comparison Summary</h2>
                                            </div>
                                            <div class="ai-report-meta" role="list">
                                                <div class="ai-report-meta-item" role="listitem">
                                                    <span class="ai-report-meta-label">Generated by</span>
                                                    <span class="ai-report-meta-value">{aiProviderName}</span>
                                                </div>
                                                <div class="ai-report-meta-item" role="listitem">
                                                    <span class="ai-report-meta-label">Model</span>
                                                    <span class="ai-report-meta-value">{aiAnalysisModelLabel}</span>
                                                </div>
                                                <div class="ai-report-meta-item" role="listitem">
                                                    <span class="ai-report-meta-label">Status</span>
                                                    <span class="slds-badge slds-theme_success">Available</span>
                                                </div>
                                                <div class="ai-report-meta-item" role="listitem">
                                                    <span class="ai-report-meta-label">Generated</span>
                                                    <span class="ai-report-meta-value">Current session</span>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="ai-report-header-actions">
                                            <lightning-button
                                                label="Copy Summary"
                                                variant="neutral"
                                                title="Copy AI Summary text"
                                                onclick={handleCopyAiSummary}>
                                            </lightning-button>
                                            <lightning-button
                                                label={aiSummaryReportToggleLabel}
                                                variant="neutral"
                                                title="Collapse or expand AI Summary report"
                                                onclick={handleToggleAiSummaryReport}
                                                aria-expanded={isAiSummaryReportExpanded}>
                                            </lightning-button>
                                        </div>
                                    </header>

                                    <template if:true={isAiSummaryReportExpanded}>
                                        <div class="ai-report-body">

                                            <template if:true={hasAiSummaryExecutive}>
                                                <section class="ai-report-section" aria-labelledby="ai-report-executive-heading">
                                                    <h3 id="ai-report-executive-heading" class="ai-report-section-title">
                                                        Executive Summary
                                                    </h3>
                                                    <p class="ai-report-prose">{aiSummaryReport.executiveSummary}</p>
                                                </section>
                                            </template>

                                            <template if:true={hasAiSummaryImpactItems}>
                                                <section class="ai-report-section" aria-labelledby="ai-report-impact-heading">
                                                    <h3 id="ai-report-impact-heading" class="ai-report-section-title">
                                                        Impact Assessment
                                                    </h3>
                                                    <ul class="ai-report-impact-list">
                                                        <template for:each={aiSummaryReport.impactItems} for:item="item">
                                                            <li key={item.key} class="ai-report-impact-row">
                                                                <lightning-icon
                                                                    icon-name={item.iconName}
                                                                    size="x-small"
                                                                    alternative-text=""
                                                                    class="ai-report-impact-icon">
                                                                </lightning-icon>
                                                                <span class="ai-report-impact-label">{item.label}</span>
                                                                <span class="ai-report-impact-detail">{item.detail}</span>
                                                            </li>
                                                        </template>
                                                    </ul>
                                                </section>
                                            </template>

                                            <template if:true={hasAiSummaryRisk}>
                                                <section class="ai-report-section" aria-labelledby="ai-report-risk-heading">
                                                    <h3 id="ai-report-risk-heading" class="ai-report-section-title">
                                                        Risk Assessment
                                                    </h3>
                                                    <template if:true={aiSummaryReport.riskLevel}>
                                                        <span class={aiSummaryRiskBadgeClass}>
                                                            {aiSummaryReport.riskLevel}
                                                        </span>
                                                    </template>
                                                    <template if:true={aiSummaryReport.riskExplanation}>
                                                        <p class="ai-report-prose ai-report-prose_risk">
                                                            {aiSummaryReport.riskExplanation}
                                                        </p>
                                                    </template>
                                                </section>
                                            </template>

                                            <template if:true={hasAiSummaryTestingItems}>
                                                <section class="ai-report-section" aria-labelledby="ai-report-testing-heading">
                                                    <h3 id="ai-report-testing-heading" class="ai-report-section-title">
                                                        Recommended Testing
                                                    </h3>
                                                    <ul class="ai-report-checklist">
                                                        <template for:each={aiSummaryReport.testingItems} for:item="item">
                                                            <li key={item.key} class="ai-report-checklist-item">
                                                                <lightning-icon
                                                                    icon-name="utility:success"
                                                                    size="x-small"
                                                                    alternative-text="Recommended"
                                                                    class="ai-report-check-icon">
                                                                </lightning-icon>
                                                                <span>{item.text}</span>
                                                            </li>
                                                        </template>
                                                    </ul>
                                                </section>
                                            </template>

                                            <template if:true={hasAiSummaryRecommendations}>
                                                <section class="ai-report-section" aria-labelledby="ai-report-recommendations-heading">
                                                    <h3 id="ai-report-recommendations-heading" class="ai-report-section-title">
                                                        Recommendations
                                                    </h3>
                                                    <ul class="ai-report-checklist">
                                                        <template for:each={aiSummaryReport.recommendationItems} for:item="item">
                                                            <li key={item.key} class="ai-report-checklist-item">
                                                                <lightning-icon
                                                                    icon-name="utility:forward"
                                                                    size="x-small"
                                                                    alternative-text=""
                                                                    class="ai-report-rec-icon">
                                                                </lightning-icon>
                                                                <span>{item.text}</span>
                                                            </li>
                                                        </template>
                                                    </ul>
                                                </section>
                                            </template>

                                            <template if:true={showAiSummaryRawFallback}>
                                                <section class="ai-report-section" aria-label="AI Summary">
                                                    <div class="ai-summary-card">
                                                        <lightning-formatted-rich-text value={formattedAiSummary}></lightning-formatted-rich-text>
                                                    </div>
                                                </section>
                                            </template>

                                        </div>
                                    </template>
                                </article>
                            </div>
                        </template>

                        <template if:true={isGeneratingSummary}>
                            <div class="ux-loading-panel" role="status" aria-live="polite">
                                <div class="ux-skeleton-block ux-skeleton-block_title"></div>
                                <div class="ux-skeleton-block"></div>
                                <div class="ux-skeleton-block ux-skeleton-block_short"></div>
                                <div class="spinner-container spinner-container_inline">
                                    <lightning-spinner alternative-text="Generating AI Summary" size="medium"></lightning-spinner>
                                    <p class="spinner-label">Generating AI Comparison Summary…</p>
                                </div>
                            </div>
                        </template>

                        <!-- Phase 1 — Comparison Summary enterprise workspace (presentation only) -->
                        <div class="cmp-summary-workspace">

                            <div class="cmp-summary-main">

                        <!-- ── Comparison Summary Accordion ── -->
                        <div class="section-card results-section-card">

                            <div class="section-card-header results-card-header cmp-summary-header">
                                <div class="cmp-summary-header-left">
                                    <span class="section-card-title">Comparison Summary</span>
                                    <span class="results-count-badge">
                                        {savedComparisonResults.length} files
                                    </span>
                                    <span class="results-count-badge deployment-badge">
                                        {selectedFileCount} selected
                                    </span>
                                    <span
                                        class="results-count-badge results-showing-badge"
                                        aria-live="polite">
                                        {comparisonSummaryShowingLabel}
                                    </span>
                                </div>
                                <div class="cmp-summary-header-right">
                                    <lightning-button
                                        label="Create Deployment Plan"
                                        variant="brand"
                                        onclick={handleCreateDeploymentPlan}
                                        disabled={isCreateDeploymentDisabled}>
                                    </lightning-button>
                                </div>
                            </div>

                            <div class="section-card-body no-pad">

                                <!-- Search + Filters toolbar -->
                                <div class="results-toolbar slds-p-around_medium">
                                    <div class="results-toolbar-row" role="search" aria-label="Comparison Summary search and filters">
                                        <div class="results-toolbar-search">
                                            <lightning-input
                                                type="search"
                                                label="Search"
                                                placeholder="Search metadata, class, object, flow..."
                                                value={searchKeyword}
                                                onchange={handleSearch}>
                                            </lightning-input>
                                        </div>
                                        <div class="results-toolbar-metadata">
                                            <lightning-combobox
                                                name="filterMetadataType"
                                                label="Metadata Type"
                                                value={filterMetadataType}
                                                options={metadataTypeFilterOptions}
                                                onchange={handleMetadataTypeFilterChange}>
                                            </lightning-combobox>
                                        </div>
                                        <div class="results-toolbar-intent">
                                            <lightning-combobox
                                                name="filterDeploymentIntent"
                                                label="Deployment Intent"
                                                value={filterDeploymentIntent}
                                                options={deploymentIntentFilterOptions}
