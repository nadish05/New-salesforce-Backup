                        </p>
                    </div>
                </template>



            </div>
        </template>
        <!-- /isComparisonView -->


        <!-- ═══════════════════════════════════════════════════════════════ -->
        <!-- PHASE 2 — STAGE 1 MODAL: ORG CONNECTION                        -->
        <!-- Read-only. Uses only: selectedComparisonDetails, sourceOrgName, -->
        <!-- destinationOrgName, sourceStatusMessage, destinationStatusMessage,-->
        <!-- sourceBranch, destinationBranch. No new Apex.                  -->
        <!-- ═══════════════════════════════════════════════════════════════ -->
        <template if:true={isStage1ModalOpen}>
            <section role="dialog" tabindex="-1" aria-label="Org Connection" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container modal-premium">

                    <header class="slds-modal__header modal-header-brand">
                        <button
                            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close"
                            onclick={closeStage1Modal}>
                            <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                        </button>
                        <div class="modal-header-icon">🔗</div>
                        <h2 class="slds-text-heading_medium modal-header-title">Org Connection</h2>
                        <p class="modal-header-sub">Stage 1 — Connected org details for this comparison</p>
                    </header>

                    <div class="slds-modal__content modal-body-padded">
                        <template if:true={selectedComparisonDetails}>

                            <div class="stage-info-grid">

                                <div class="stage-info-panel stage-info-source">
                                    <div class="stage-info-badge source-badge">SOURCE ORG</div>
                                    <div class="org-status-chip chip-success">✓ Active</div>
                                    <div class="stage-info-name">{sourceOrgName}</div>
                                    
                                    <div class="stage-info-row">
                                        <span class="stage-info-label">Branch</span>
                                        <span class="stage-info-value-branch">{sourceBranch}</span>
                                    </div>
                                    <div class="stage-info-row">
                                        <span class="stage-info-label">Status</span>
                                        <span class="stage-info-value-status">{sourceStatusMessage}</span>
                                    </div>
                                </div>

                                <div class="stage-info-panel stage-info-dest">
                                    <div class="stage-info-badge destination-badge">DESTINATION ORG</div>
                                    <div class="org-status-chip chip-success">✓ Active</div>
                                    <div class="stage-info-name">{destinationOrgName}</div>
                                    <div class="stage-info-row">
                                        <span class="stage-info-label">Branch</span>
                                        <span class="stage-info-value-branch">{destinationBranch}</span>
                                    </div>
                                    <div class="stage-info-row">
                                        <span class="stage-info-label">Status</span>
                                        <span class="stage-info-value-status">{destinationStatusMessage}</span>
                                    </div>
                                </div>

                            </div>

                            <div class="stage-info-hint">
                                To connect a new org, use the <strong>Connect Org</strong> button in the workspace header.
                            </div>

                        </template>
                        <template if:false={selectedComparisonDetails}>
                            <p>Select a comparison to view org connection details.</p>
                        </template>
                    </div>

                    <footer class="slds-modal__footer modal-footer-clean">
                        <lightning-button label="Close" onclick={closeStage1Modal}></lightning-button>
                    </footer>

                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>


        <!-- ═══════════════════════════════════════════════════════════════ -->
        <!-- PHASE 3 — STAGE 2 MODAL: METADATA RETRIEVAL                    -->
        <!-- Moved from inline comparison view. No logic changes.           -->
        <!-- ═══════════════════════════════════════════════════════════════ -->
        <template if:true={isStage2ModalOpen}>
            <section role="dialog" tabindex="-1" aria-label="Metadata Retrieval" aria-modal="true" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container modal-wide">

                    <header class="slds-modal__header modal-header-brand">
                        <template if:false={isStage2CloseDisabled}>
                            <button
                                class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                title="Close"
                                onclick={closeStage2Modal}>
                                <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                            </button>
                        </template>
                        <div class="modal-header-icon">📥</div>
                        <h2 class="slds-text-heading_medium modal-header-title">Metadata Retrieval</h2>
                        <p class="modal-header-sub">Stage 2 — Push metadata from each org to its GitHub branch</p>
                    </header>

                    <div class="slds-modal__content modal-body-padded">

                        <template if:true={isRetrievalInProgress}>
                            <div
                                class="retrieval-lock-banner"
                                role="status"
                                aria-live="polite"
                                aria-atomic="true">
                                <div class="retrieval-lock-banner__row">
                                    <div class="retrieval-lock-banner__copy">
                                        <p class="retrieval-lock-banner__title">
                                            Metadata Retrieval in Progress
                                        </p>
                                        <p class="retrieval-lock-banner__body">
                                            Please keep this page open while metadata is being retrieved.
                                            Navigation and comparison changes are temporarily disabled
                                            to prevent interrupting the process.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- Source + Destination Panels — moved verbatim from inline view -->
                        <div class="results-orgs-grid">

                            <!-- Source Org -->
                            <div class="comparison-panel source-panel">
                                <div class="org-panel-header">
                                    <div class="org-badge source-badge">SOURCE ORG</div>
                                    <template if:true={sourceMigrationCompleted}>
                                        <div class="org-status-chip chip-success">✓ Synced</div>
                                    </template>
                                    <template if:false={sourceMigrationCompleted}>
                                        <div class="org-status-chip chip-pending">Pending</div>
                                    </template>
                                </div>
                                <div class="org-name">{sourceOrgName}</div>
                                <lightning-input
                                    label="Branch Name"
                                    value={sourceBranch}
                                    onchange={handleSourceBranchChange}
                                    disabled={sourceMigrationCompleted}>
                                </lightning-input>
                                <template if:true={sourceStatusMessage}>
                                    <div class="migration-status-pill status-success-pill" role="status" aria-live="polite">
                                        ✓ {sourceStatusMessage}
                                    </div>
                                </template>
                                <div class="form-actions">
                                    <lightning-button
                                        label="Start Retrieval"
                                        variant="brand"
                                        onclick={handleSourceMigration}
                                        disabled={disableSourceButton}>
                                    </lightning-button>
                                </div>
                            </div>

                            <div class="org-vs-divider" aria-hidden="true">
                                <span class="org-vs-circle">VS</span>
                            </div>

                            <!-- Destination Org -->
                            <div class="comparison-panel destination-panel">
                                <div class="org-panel-header">
                                    <div class="org-badge destination-badge">DESTINATION ORG</div>
                                    <template if:true={destinationMigrationCompleted}>
                                        <div class="org-status-chip chip-success">✓ Synced</div>
                                    </template>
                                    <template if:false={destinationMigrationCompleted}>
                                        <div class="org-status-chip chip-pending">Pending</div>
                                    </template>
                                </div>
                                <div class="org-name">{destinationOrgName}</div>
                                <lightning-input
                                    label="Branch Name"
                                    value={destinationBranch}
                                    onchange={handleDestinationBranchChange}
                                    disabled={destinationMigrationCompleted}>
                                </lightning-input>
                                <template if:true={destinationStatusMessage}>
                                    <div class="migration-status-pill status-success-pill" role="status" aria-live="polite">
                                        ✓ {destinationStatusMessage}
                                    </div>
                                </template>
                                <div class="form-actions">
                                    <lightning-button
                                        label="Start Retrieval"
                                        variant="brand"
                                        onclick={handleDestinationMigration}
                                        disabled={disableDestinationButton}>
                                    </lightning-button>
                                </div>
                            </div>

                        </div>

                    </div>



                    <footer class="slds-modal__footer modal-footer-clean">
                        <div class="retrieval-warning">
        <strong>
            While retrieval is in progress, please keep this page open and do not refresh or close it.
        </strong>
    </div>
                        <template if:false={isStage2CloseDisabled}>
                            <lightning-button label="Close" onclick={closeStage2Modal}></lightning-button>
                        </template>
                    </footer>

                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" aria-hidden="true"></div>
        </template>


        <!-- ═══════════════════════════════════════════════════════════════ -->
        <!-- PHASE 3 — STAGE 3 MODAL: METADATA COMPARISON ACTIONS ONLY     -->
        <!-- Compare action + spinner. AI controls live in Stage 3 workspace. -->
        <!-- Results render in Stage 3 workspace. No duplication.           -->
        <!-- ═══════════════════════════════════════════════════════════════ -->
        <template if:true={isStage3ModalOpen}>
            <section role="dialog" tabindex="-1" aria-label="Metadata Comparison" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container modal-premium">

                    <header class="slds-modal__header modal-header-brand">
                        <button
                            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close"
                            onclick={closeStage3Modal}>
                            <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                        </button>
                        <div class="modal-header-icon">⚖️</div>
                        <h2 class="slds-text-heading_medium modal-header-title">Metadata Comparison</h2>
                        <p class="modal-header-sub">Stage 3 — Compare branches and generate AI summary</p>
                    </header>

                    <div class="slds-modal__content modal-body-padded">

                        <!-- Comparison action bar -->
                        <template if:true={showCompareButton}>
                            <div class="compare-action-bar">

                                <div class="compare-row">
                                    <lightning-button
                                        label="Compare Metadata"
                                        variant="success"
                                        onclick={handleCompare}
                                        disabled={isCompareButtonDisabled}>
                                    </lightning-button>
                                </div>

                            </div>
                        </template>

                        <!-- Not-ready hint when retrieval incomplete -->
                        <template if:false={showCompareButton}>
                            <div class="stage-info-hint">
                                Complete <strong>Stage 2 — Metadata Retrieval</strong> for both orgs before running a comparison.
                            </div>
                        </template>

                        <!-- Comparing indicator — reuses the shared .ops-core
                             spatial layers with a comparison-only variant. -->
                        <template if:true={isComparing}>
                            <div class="ux-loading-panel" role="status" aria-live="polite">
                                <div class="ops-load ops-load_comparison stage3-compare-load">
                                    <div class="stage3-compare-rail" aria-hidden="true">

                                        <div class="stage3-compare-node stage3-compare-node_source">
                                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M7.2 18C4.9 18 3 16.1 3 13.8c0-2 1.4-3.7 3.3-4.1C6.9 6.4 9.6 4 12.8 4c3.3 0 6 2.5 6.4 5.7 1.6.4 2.8 1.9 2.8 3.6 0 2-1.7 3.7-3.7 3.7H7.2z" fill="currentColor"></path>
                                            </svg>
                                        </div>

                                        <div class="stage3-compare-stream stage3-compare-stream_source">
                                            <span class="stage3-compare-particle"></span>
                                            <span class="stage3-compare-particle"></span>
                                            <span class="stage3-compare-particle"></span>
                                        </div>

                                        <div class="ops-core">
                                            <span class="ops-core__glow"></span>
                                            <span class="ops-core__rim"></span>
                                            <span class="ops-core__ring"></span>
                                            <span class="stage3-compare-pulse"></span>
                                            <span class="ops-core__glass">
                                                <span class="ops-core__liquid"></span>
                                                <span class="ops-core__liquid ops-core__liquid_alt"></span>
                                                <span class="ops-core__scan"></span>
                                                <span class="ops-core__glyph">
                                                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                                        <path d="M1.9 10.9 4.4 14.3l2.5-3.4zM17.1 10.9l2.5 3.4 2.5-3.4z" fill="currentColor" opacity="0.16"></path>
                                                        <path d="M12 6.6v13.2M8.4 19.8h7.2M4.4 8.2h15.2M4.4 8.2v2.7M19.6 8.2v2.7M1.9 10.9 4.4 14.3l2.5-3.4M17.1 10.9l2.5 3.4 2.5-3.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path>
                                                        <circle cx="12" cy="5.7" r="1.35" fill="currentColor"></circle>
                                                    </svg>
                                                </span>
                                            </span>
                                        </div>

                                        <div class="stage3-compare-stream stage3-compare-stream_destination">
                                            <span class="stage3-compare-particle"></span>
                                            <span class="stage3-compare-particle"></span>
                                            <span class="stage3-compare-particle"></span>
                                        </div>

                                        <div class="stage3-compare-node stage3-compare-node_destination">
                                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M7.2 18C4.9 18 3 16.1 3 13.8c0-2 1.4-3.7 3.3-4.1C6.9 6.4 9.6 4 12.8 4c3.3 0 6 2.5 6.4 5.7 1.6.4 2.8 1.9 2.8 3.6 0 2-1.7 3.7-3.7 3.7H7.2z" fill="currentColor"></path>
                                            </svg>
                                        </div>

                                    </div>
                                    <p class="spinner-label stage3-compare-copy">Comparing branches…</p>
                                </div>
                            </div>
                        </template>

                        <!-- Completed state hint -->
                        <template if:true={compareCompleted}>
                            <div class="stage-complete-hint" role="status">
                                ✓ Comparison complete. Differences are ready to review in the Stage 3 workspace —
                                select the files you want to carry forward, then create a deployment plan when ready.
                            </div>
                        </template>

                    </div>

                    <footer class="slds-modal__footer modal-footer-clean">
                        <lightning-button label="Close" onclick={closeStage3Modal}></lightning-button>
                    </footer>

                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>


        <!-- ═══════════════════════════════════════════════════════════════ -->
        <!-- EXISTING MODALS — UNCHANGED                                     -->
        <!-- ═══════════════════════════════════════════════════════════════ -->

        <!-- New Comparison Modal — unchanged -->
        <template if:true={isNewComparisonModalOpen}>
            <section role="dialog" tabindex="-1" aria-label="Create Comparison" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container modal-premium">
                    <header class="slds-modal__header modal-header-brand">
                        <button
                            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close"
                            onclick={closeNewComparisonModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                        </button>
                        <div class="modal-header-icon">⚖️</div>
                        <h2 class="slds-text-heading_medium modal-header-title">Create Comparison</h2>
                        <p class="modal-header-sub">Define a new metadata comparison between two Salesforce orgs</p>
                    </header>
                    <div class="slds-modal__content modal-body-padded">
                        <div class="modal-field-group">
                            <lightning-input
                                label="Comparison Name"
                                value={comparisonName}
                                placeholder="e.g. Production vs UAT — June 2025"
                                onchange={handleComparisonNameChange}>
                            </lightning-input>
                        </div>
                        <div class="modal-field-row">
                            <div class="modal-field-group">
                                <lightning-combobox
                                    label="Source Org"
                                    value={sourceOrgId}
                                    options={orgOptions}
                                    onchange={handleSourceOrgChange}>
                                </lightning-combobox>
                            </div>
                            <div class="modal-field-group">
                                <lightning-combobox
                                    label="Destination Org"
                                    value={destinationOrgId}
                                    options={orgOptions}
                                    onchange={handleDestinationOrgChange}>
                                </lightning-combobox>
                            </div>
                        </div>
                    </div>
                    <footer class="slds-modal__footer modal-footer-clean">
                        <lightning-button label="Cancel" onclick={closeNewComparisonModal}></lightning-button>
                        <lightning-button label="Save Comparison" variant="brand" onclick={handleSaveComparisonFromModal}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- Connect Org Modal — unchanged -->
        <template if:true={isConnectOrgModalOpen}>
            <section role="dialog" tabindex="-1" aria-label="Connect New Org" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container modal-premium">
                    <header class="slds-modal__header modal-header-brand">
                        <button
                            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close"
                            onclick={closeConnectOrgModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                        </button>
                        <div class="modal-header-icon">🔗</div>
                        <h2 class="slds-text-heading_medium modal-header-title">Connect New Org</h2>
                        <p class="modal-header-sub">Authenticate a Salesforce org via OAuth to enable metadata retrieval</p>
                    </header>
                    <div class="slds-modal__content modal-body-padded">
                        <div class="modal-field-group">
                            <lightning-input
                                label="Connected Org Name"
                                value={orgDisplayName}
                                onchange={handleOrgDisplayNameChange}>
                            </lightning-input>
                        </div>
                        <div class="modal-field-group">
                            <lightning-combobox
                                label="Environment"
                                value={environment}
                                options={environmentOptions}
                                onchange={handleEnvironmentChange}>
                            </lightning-combobox>
                        </div>
                    </div>
                    <footer class="slds-modal__footer modal-footer-clean">
                        <lightning-button label="Cancel" onclick={closeConnectOrgModal}></lightning-button>
                        <lightning-button label="Connect New Org" variant="brand" onclick={connectNewOrg}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- File Details Modal — unchanged -->
        <template if:true={showFileDetailsModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Metadata Details</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_large">
                        <div class="detail-row">
                            <span class="detail-label">Metadata Type</span>
                            <span class="detail-value">{selectedFile.Metadata_Type__c}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">File Name</span>
                            <span class="detail-value">{selectedFile.File_Name__c}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">File Path</span>
                            <span class="detail-value">{selectedFile.File_Path__c}</span>
                        </div>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="View Difference" variant="brand" onclick={handleViewDifference}></lightning-button>
                        <lightning-button label="Close" onclick={closeFileDetailsModal}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- Diff Modal — presentation polish only -->
        <template if:true={showDiffModal}>
            <section
                role="dialog"
                tabindex="-1"
                aria-modal="true"
                aria-labelledby="git-diff-report-heading"
                class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container modal-wide diff-report-modal">

                    <header class="slds-modal__header diff-report-header">
                        <h2 id="git-diff-report-heading" class="slds-text-heading_medium diff-report-title">
                            Git Difference Report
                        </h2>
                        <p class="diff-report-subtitle">Enterprise metadata review</p>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium diff-report-content">
                        <template if:true={differenceReport}>

                            <div class="summary-card diff-summary-card">
                                <div class="summary-row">
                                    <span class="summary-label">File</span>
                                    <span class="summary-value summary-value_mono">{selectedFile.File_Name__c}</span>
                                </div>
                                <div class="summary-row">
                                    <span class="summary-label">Metadata Type</span>
                                    <span class="summary-value">{selectedFile.Metadata_Type__c}</span>
                                </div>
                                <div class="summary-row">
                                    <span class="summary-label">Status</span>
                                    <span class="summary-value">
                                        <template if:true={isDeleted}>
                                            <span class="diff-status-pill diff-status-pill_deleted">Deleted</span>
                                            <span class="diff-status-note">Missing in Destination Org</span>
                                        </template>
                                        <template if:true={isNew}>
                                            <span class="diff-status-pill diff-status-pill_new">New</span>
                                            <span class="diff-status-note">Added</span>
                                        </template>
                                        <template if:true={isModified}>
                                            <span class="diff-status-pill diff-status-pill_modified">Modified</span>
                                        </template>
                                    </span>
                                </div>
                                <div class="summary-row">
                                    <span class="summary-label">Explanation</span>
                                    <span class="summary-value status-explanation">{statusMessage}</span>
                                </div>
                                <div class="diff-summary-metrics">
                                    <div class="diff-metric diff-metric_added">
                                        <span class="diff-metric-label">Added Lines</span>
                                        <span class="diff-metric-value">{differenceReport.addedLines}</span>
                                    </div>
                                    <div class="diff-metric diff-metric_removed">
                                        <span class="diff-metric-label">Removed Lines</span>
                                        <span class="diff-metric-value">{differenceReport.removedLines}</span>
                                    </div>
                                </div>
                            </div>

                            <div class="diff-actions">
                                <template if:true={supportsDiffViewTabs}>
                                    <div class="diff-view-tabs" role="tablist" aria-label="Diff view mode">
                                        <button
                                            type="button"
                                            class={splitViewTabClass}
                                            role="tab"
                                            data-mode="split"
                                            aria-selected={isSplitViewMode}
                                            onclick={handleDiffViewModeSelect}>
                                            Split View
                                        </button>
                                        <button
                                            type="button"
                                            class={unifiedViewTabClass}
                                            role="tab"
                                            data-mode="unified"
                                            aria-selected={isUnifiedViewMode}
                                            onclick={handleDiffViewModeSelect}>
                                            Unified Diff
                                        </button>
                                    </div>
                                </template>
                                <lightning-button
                                    class="diff-action-button"
                                    label="Explain with AI"
                                    variant="brand"
                                    onclick={handleExplainWithAI}>
                                </lightning-button>
                            </div>

                            <template if:true={isGeneratingExplanation}>
                                <div class="diff-explain-loading" role="status" aria-live="polite">
                                    <lightning-spinner alternative-text="Generating AI Explanation" size="small"></lightning-spinner>
                                    <span>Generating AI explanation…</span>
                                </div>
                            </template>

                            <template if:true={aiExplanation}>
                                <lightning-card title="AI Change Explanation" class="diff-ai-card">
                                    <div class="ai-provider-badge">Generated by {aiProviderName}</div>
                                    <div class="slds-p-around_medium">
                                        <div class="ai-summary-content">{aiExplanation}</div>
                                    </div>
                                </lightning-card>
                            </template>

                            <template if:true={showSplitView}>
                                <div class="code-review-panel" aria-label="Side by side Git difference">
                                    <div class="code-review-panel-toolbar">
                                        <span class="code-review-panel-title">Split Comparison</span>
                                    </div>
                                    <div class="split-diff">
                                        <div class="split-diff-headers">
                                            <div class="split-diff-header split-diff-header_left">
                                                Source Org
                                            </div>
                                            <div class="split-diff-header split-diff-header_right">
                                                Destination Org
                                            </div>
                                        </div>

                                        <!-- MODIFIED: paired rows (unchanged) -->
                                        <template if:true={showSplitPairedRows}>
                                            <div class="split-diff-body">
                                                <template for:each={splitDiffRows} for:item="row">
                                                    <div key={row.id} class="split-diff-row">
                                                        <div class={row.rightClass}>{row.rightText}</div>
                                                        <div class={row.leftClass}>{row.leftText}</div>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>

                                        <!-- NEW / DELETED: content pane + enterprise placeholder
                                             Product semantics (statusMessage):
                                             NEW → Source missing, Destination has content (rightText / +)
                                             DELETED → Source has content (leftText / -), Destination missing -->
                                        <template if:true={showSplitAsymmetric}>
                                            <div class="split-diff-body split-diff-body_asymmetric">
                                                <div class="split-diff-pane">
                                                    <template if:true={showSplitSourcePlaceholder}>
                                                        <div class="split-placeholder-panel" role="status">
                                                            <lightning-icon
                                                                icon-name="utility:info"
                                                                size="small"
                                                                alternative-text="Information">
                                                            </lightning-icon>
                                                            <div class="split-placeholder-title">Source Org</div>
                                                            <p class="split-placeholder-message">
                                                                This metadata does not exist in the Source Org.
                                                            </p>
                                                            <p class="split-placeholder-message split-placeholder-message_secondary">
                                                                No content is available for comparison.
                                                            </p>
                                                        </div>
                                                    </template>
                                                    <template if:false={showSplitSourcePlaceholder}>
                                                        <template for:each={splitDiffRows} for:item="row">
                                                            <div key={row.id} class={row.leftClass}>{row.leftText}</div>
                                                        </template>
                                                    </template>
                                                </div>
                                                <div class="split-diff-pane">
                                                    <template if:true={showSplitDestinationPlaceholder}>
                                                        <div class="split-placeholder-panel" role="status">
                                                            <lightning-icon
                                                                icon-name="utility:info"
                                                                size="small"
                                                                alternative-text="Information">
                                                            </lightning-icon>
                                                            <div class="split-placeholder-title">Destination Org</div>
                                                            <p class="split-placeholder-message">
                                                                This metadata does not exist in the Destination Org.
                                                            </p>
                                                            <p class="split-placeholder-message split-placeholder-message_secondary">
                                                                No content is available for comparison.
                                                            </p>
                                                        </div>
                                                    </template>
                                                    <template if:false={showSplitDestinationPlaceholder}>
                                                        <template for:each={splitDiffRows} for:item="row">
                                                            <div key={row.id} class={row.rightClass}>{row.rightText}</div>
                                                        </template>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <template if:true={showUnifiedDiffPanel}>
                                <div class="code-review-panel" aria-label="Unified Git difference">
                                    <div class="code-review-panel-toolbar">
                                        <span class="code-review-panel-title">Unified Diff</span>
                                    </div>
                                    <div class="diff-container">
                                        <template for:each={formattedDiff} for:item="line">
                                            <div key={line.id} class={line.className}>{line.text}</div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                        </template>
                    </div>

                    <footer class="slds-modal__footer diff-report-footer">
                        <lightning-button
                            class="diff-action-button"
                            label="Close"
                            onclick={closeDiffModal}>
                        </lightning-button>
                    </footer>

                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>


        <!-- Phase 2B - Ignored dependency conflicts (informational only) -->
        <template if:true={showIgnoredDependencyModal}>
            <section
                role="dialog"
                tabindex="-1"
                aria-labelledby="ignored-dependency-heading"
                aria-describedby="ignored-dependency-description"
                aria-modal="true"
                class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container modal-wide">
                    <header class="slds-modal__header">
                        <button
                            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close"
                            onclick={closeIgnoredDependencyModal}
                            disabled={isIgnoredDependencyActionDisabled}>
                            <lightning-icon
                                icon-name="utility:close"
                                alternative-text="Close"
                                size="small">
                            </lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2
                            id="ignored-dependency-heading"
                            class="slds-text-heading_medium">
                            Required Metadata Was Ignored
                        </h2>
                        <p class="slds-m-top_x-small slds-text-body_regular">
                            Some metadata you marked as Ignore is required by metadata
                            selected for deployment.
                        </p>
                    </header>
                    <div
                        class="slds-modal__content slds-p-around_medium ignored-dependency-modal-content"
                        id="ignored-dependency-description">
                        <p class="slds-m-bottom_small slds-text-body_regular">
                            These components cannot be automatically excluded because they
                            are required dependencies.
                        </p>
                        <p class="slds-m-bottom_medium slds-text-body_regular slds-text-color_weak">
                            Review the conflicts below before continuing.
                        </p>
                        <lightning-datatable
                            key-field="id"
                            data={ignoredConflictTableRows}
                            columns={ignoredConflictColumns}
                            hide-checkbox-column
                            show-row-number-column>
                        </lightning-datatable>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button
                            label="Cancel"
                            onclick={closeIgnoredDependencyModal}
                            disabled={isIgnoredDependencyActionDisabled}
                            class="slds-m-right_small">
                        </lightning-button>
                        <lightning-button
                            label="Include Required Metadata"
                            variant="brand"
                            onclick={handleIncludeRequiredMetadata}
                            disabled={isIgnoredDependencyActionDisabled}>
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- Phase 18.3 — Support Bundle (download-only diagnostic) -->
        <template if:true={showSupportBundleModal}>
            <section
                role="dialog"
                tabindex="-1"
                aria-labelledby="support-bundle-heading"
                aria-modal="true"
                class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button
                            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close"
                            onclick={closeSupportBundleModal}
                            disabled={isGenerateSupportBundleDisabled}>
                            <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 id="support-bundle-heading" class="slds-text-heading_medium">
                            Generate Support Bundle
                        </h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="slds-m-bottom_small">
                            This creates a sanitized diagnostic bundle containing the validation
                            details needed to investigate this deployment issue.
                        </p>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                            Delivery: Download only. No email is sent. No deployment, Auto Fix,
                            SAFE_SKIP, or AI request is performed.
                        </p>

                        <template if:true={supportBundleGenerating}>
                            <div class="slds-is-relative support-bundle-loading" role="status">
                                <lightning-spinner alternative-text="Generating support bundle" size="small"></lightning-spinner>
                                <span class="slds-m-left_small">Generating support bundle…</span>
                            </div>
                        </template>

                        <template if:true={supportBundleError}>
                            <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_small" role="alert">
                                <span class="slds-assistive-text">Error</span>
                                <h2>{supportBundleError}</h2>
                            </div>
                        </template>

                        <template if:true={supportBundleReady}>
                            <div class="support-bundle-ready slds-box slds-theme_success slds-m-bottom_small">
                                <h3 class="slds-text-heading_small">Support Bundle Ready</h3>
                                <dl class="slds-dl_horizontal slds-m-top_small">
                                    <dt class="slds-dl_horizontal__label"><p class="slds-truncate">Bundle ID</p></dt>
                                    <dd class="slds-dl_horizontal__detail">{supportBundleId}</dd>
                                    <dt class="slds-dl_horizontal__label"><p class="slds-truncate">Filename</p></dt>
                                    <dd class="slds-dl_horizontal__detail">{supportBundleFilename}</dd>
                                    <dt class="slds-dl_horizontal__label"><p class="slds-truncate">Delivery</p></dt>
                                    <dd class="slds-dl_horizontal__detail">Download only</dd>
                                </dl>
                            </div>
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button
                            label="Cancel"
                            onclick={closeSupportBundleModal}
                            disabled={isGenerateSupportBundleDisabled}
                            class="slds-m-right_small">
                        </lightning-button>
                        <template if:false={supportBundleReady}>
                            <lightning-button
                                label={generateSupportBundleButtonLabel}
                                variant="brand"
                                onclick={handleGenerateSupportBundle}
                                disabled={isGenerateSupportBundleDisabled}>
                            </lightning-button>
                        </template>
                        <template if:true={supportBundleReady}>
                            <lightning-button
                                label="Download Support Bundle"
                                variant="brand"
                                onclick={handleDownloadSupportBundle}>
                            </lightning-button>
                        </template>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- Ignored metadata auto-included (informational - Stage 5 Validation) -->
        <template if:true={showIgnoredAutoIncludedModal}>
            <section
                role="dialog"
                tabindex="-1"
                aria-labelledby="ignored-auto-included-heading"
                aria-describedby="ignored-auto-included-description"
                aria-modal="true"
                class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container modal-wide">
                    <header class="slds-modal__header">
                        <button
                            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close"
                            onclick={closeIgnoredAutoIncludedModal}>
                            <lightning-icon
                                icon-name="utility:close"
                                alternative-text="Close"
                                size="small">
                            </lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2
                            id="ignored-auto-included-heading"
                            class="slds-text-heading_medium">
                            Ignored Metadata Automatically Included
                        </h2>
                    </header>
                    <div
                        class="slds-modal__content slds-p-around_medium ignored-dependency-modal-content"
                        id="ignored-auto-included-description">
                        <p class="slds-m-bottom_small slds-text-body_regular">
                            Some metadata that you previously marked as Ignore
                            is included in the final deployment package.
                        </p>
                        <p class="slds-m-bottom_small slds-text-body_regular">
                            This metadata is required for a valid deployment package.
                        </p>
                        <p class="slds-m-bottom_medium slds-text-body_regular slds-text-color_weak">
                            If you want to review optional deployment decisions,
                            open Deployment Planner.
                        </p>
                        <lightning-datatable
                            key-field="id"
                            data={ignoredAutoIncludedTableRows}
                            columns={ignoredAutoIncludedColumns}
                            hide-checkbox-column
                            show-row-number-column>
                        </lightning-datatable>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button
                            label="Close"
                            onclick={closeIgnoredAutoIncludedModal}
                            class="slds-m-right_small">
                        </lightning-button>
                        <lightning-button
                            label="Open Deployment Planner"
                            variant="brand"
                            onclick={handleOpenDeploymentPlannerFromAutoIncluded}>
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>


        <!-- ═══════════════════════════════════════════════════════════════ -->
        <!-- OPERATION OVERLAY — full-workspace lock while a long-running    -->
        <!-- operation is active. Driven only by the existing flags, in a    -->
        <!-- deterministic priority chain: deploy > validate > retrieve.     -->
        <!-- Presentation only: no new state, no timers, no API calls.       -->
        <!-- ═══════════════════════════════════════════════════════════════ -->
        <template if:true={isDeploying}>
            <div
                class="ops-overlay"
                role="status"
                aria-live="polite"
                aria-atomic="true"
                aria-busy="true">
                <div class="ops-overlay__scrim" aria-hidden="true"></div>
                <div class="ops-load ops-load_overlay ops-load_deployment">
                    <div class="ops-core" aria-hidden="true">
                        <span class="ops-core__glow"></span>
                        <span class="ops-core__rim"></span>
                        <span class="ops-core__ring"></span>
                        <span class="ops-core__dot"></span>
                        <span class="ops-core__dot"></span>
                        <span class="ops-core__dot"></span>
                        <span class="ops-core__dot"></span>
                        <span class="ops-core__glass">
                            <span class="ops-core__liquid"></span>
                            <span class="ops-core__liquid ops-core__liquid_alt"></span>
                            <span class="ops-core__glyph">
                                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 2.4 3.2 6.8v10.4L12 21.6l8.8-4.4V6.8L12 2.4z" fill="currentColor" opacity="0.14"></path>
                                    <path d="M12 2.4 3.2 6.8v10.4L12 21.6l8.8-4.4V6.8L12 2.4zM3.2 6.8 12 11.2l8.8-4.4M12 11.2v10.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path>
                                </svg>
                            </span>
                        </span>
                        <span class="ops-core__badge ops-core__badge_cloud">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M7.2 18C4.9 18 3 16.1 3 13.8c0-2 1.4-3.7 3.3-4.1C6.9 6.4 9.6 4 12.8 4c3.3 0 6 2.5 6.4 5.7 1.6.4 2.8 1.9 2.8 3.6 0 2-1.7 3.7-3.7 3.7H7.2z" fill="currentColor"></path>
                            </svg>
                        </span>
                    </div>
                    <div class="ops-load__copy">
                        <p class="ops-load__title">Deploying Metadata</p>
                        <p class="ops-load__sub">
                            Deploying the validated package to the destination org.
                        </p>
                    </div>
                </div>
            </div>
        </template>

        <template if:false={isDeploying}>
            <template if:true={isLoadingDeploymentValidation}>
                <div
                    class="ops-overlay"
                    role="status"
                    aria-live="polite"
                    aria-atomic="true"
                    aria-busy="true">
                    <div class="ops-overlay__scrim" aria-hidden="true"></div>
                    <div class="ops-load ops-load_overlay ops-load_validation">
                        <div class="ops-core" aria-hidden="true">
                            <span class="ops-core__glow"></span>
                            <span class="ops-core__rim"></span>
                            <span class="ops-core__ring"></span>
                            <span class="ops-core__dot"></span>
                            <span class="ops-core__dot"></span>
                            <span class="ops-core__dot"></span>
                            <span class="ops-core__dot"></span>
                            <span class="ops-core__glass">
                                <span class="ops-core__liquid"></span>
                                <span class="ops-core__liquid ops-core__liquid_alt"></span>
                                <span class="ops-core__scan"></span>
                                <span class="ops-core__glyph">
                                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M12 2.4 3.2 6.8v10.4L12 21.6l8.8-4.4V6.8L12 2.4z" fill="currentColor" opacity="0.14"></path>
                                        <path d="M12 2.4 3.2 6.8v10.4L12 21.6l8.8-4.4V6.8L12 2.4zM3.2 6.8 12 11.2l8.8-4.4M12 11.2v10.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path>
                                    </svg>
                                </span>
                            </span>
                            <span class="ops-core__badge ops-core__badge_shield">
                                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 2.5 20 5.4v6.1c0 4.5-3.3 8.5-8 9.9-4.7-1.4-8-5.4-8-9.9V5.4l8-2.9z" fill="currentColor"></path>
                                    <path d="m8.4 12.1 2.5 2.5 4.7-4.9" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path>
                                </svg>
                            </span>
                        </div>
                        <div class="ops-load__copy">
                            <p class="ops-load__title">Validating Deployment</p>
                            <p class="ops-load__sub">
                                Checking destination connectivity, metadata, dependencies, and deployment readiness.
                            </p>
                            <template if:true={validationStatusMessage}>
                                <p class="spinner-label ops-load__status">{validationStatusMessage}</p>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <template if:false={isLoadingDeploymentValidation}>
                <template if:true={isRetrievalInProgress}>
                    <div
                        class="ops-overlay"
                        role="status"
                        aria-live="polite"
                        aria-atomic="true"
                        aria-busy="true">
                        <div class="ops-overlay__scrim" aria-hidden="true"></div>
                        <div class="ops-load ops-load_overlay ops-load_retrieval">
                            <div class="ops-core" aria-hidden="true">
                                <span class="ops-core__glow"></span>
                                <span class="ops-core__rim"></span>
                                <span class="ops-core__ring"></span>
                                <span class="ops-core__dot"></span>
                                <span class="ops-core__dot"></span>
                                <span class="ops-core__dot"></span>
                                <span class="ops-core__dot"></span>
                                <span class="ops-core__glass">
                                    <span class="ops-core__liquid"></span>
                                    <span class="ops-core__liquid ops-core__liquid_alt"></span>
                                    <span class="ops-core__glyph">
                                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M12 2.4 3.2 6.8v10.4L12 21.6l8.8-4.4V6.8L12 2.4z" fill="currentColor" opacity="0.14"></path>
                                            <path d="M12 2.4 3.2 6.8v10.4L12 21.6l8.8-4.4V6.8L12 2.4zM3.2 6.8 12 11.2l8.8-4.4M12 11.2v10.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path>
                                        </svg>
                                    </span>
                                </span>
                                <span class="ops-core__badge ops-core__badge_org">
                                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M7.2 18C4.9 18 3 16.1 3 13.8c0-2 1.4-3.7 3.3-4.1C6.9 6.4 9.6 4 12.8 4c3.3 0 6 2.5 6.4 5.7 1.6.4 2.8 1.9 2.8 3.6 0 2-1.7 3.7-3.7 3.7H7.2z" fill="currentColor"></path>
                                    </svg>
                                </span>
                            </div>
                            <div class="ops-load__copy">
                                <p class="ops-load__title">Retrieving Metadata</p>

                                <!-- Read-only status console. Renders the existing
                                     status properties updated by the existing
                                     polling mechanism. No new state or timers. -->
                                <div class="retrieval-status" aria-live="polite">
                                    <p class="retrieval-status__label">Retrieval Status</p>

                                    <template if:true={isSourceRetrievalRunning}>
                                        <template if:true={isDestinationRetrievalRunning}>
                                            <div class="retrieval-status__row">
                                                <span class="retrieval-status__org">Source Org</span>
                                                <span class="retrieval-status__line">
                                                    <span class="retrieval-status__dot" aria-hidden="true"></span>
                                                    <span class="retrieval-status__text">{sourceStatusMessage}</span>
                                                </span>
                                            </div>
                                            <div class="retrieval-status__row">
                                                <span class="retrieval-status__org">Destination Org</span>
                                                <span class="retrieval-status__line">
                                                    <span class="retrieval-status__dot" aria-hidden="true"></span>
                                                    <span class="retrieval-status__text">{destinationStatusMessage}</span>
                                                </span>
                                            </div>
                                        </template>
                                        <template if:false={isDestinationRetrievalRunning}>
                                            <div class="retrieval-status__row">
                                                <span class="retrieval-status__line">
                                                    <span class="retrieval-status__dot" aria-hidden="true"></span>
                                                    <span class="retrieval-status__text">{sourceStatusMessage}</span>
                                                </span>
                                            </div>
                                        </template>
                                    </template>

                                    <template if:false={isSourceRetrievalRunning}>
                                        <template if:true={isDestinationRetrievalRunning}>
                                            <div class="retrieval-status__row">
                                                <span class="retrieval-status__line">
                                                    <span class="retrieval-status__dot" aria-hidden="true"></span>
                                                    <span class="retrieval-status__text">{destinationStatusMessage}</span>
                                                </span>
                                            </div>
                                        </template>
                                    </template>
                                </div>

                                <p class="ops-load__note">
                                    While retrieval is in progress, please keep this page open
                                    and do not refresh or close it.
                                </p>
                            </div>
                        </div>
                    </div>
                </template>
            </template>
        </template>
    </div>
</template>
