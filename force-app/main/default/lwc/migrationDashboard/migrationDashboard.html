                            <div class="section-card-header results-card-header">
                                <span class="section-card-title">Deployment Review</span>
                                <lightning-button
                                    label="Review Deployment"
                                    variant="neutral"
                                    onclick={handleReviewDeployment}
                                    disabled={isReviewDeploymentDisabled}>
                                </lightning-button>
                                <span class="results-count-badge deployment-badge">
                                    {selectedFileCount} selected
                                </span>
                            </div>
                        </div>

                        <template if:true={isLoadingDeploymentReview}>
                            <lightning-spinner alternative-text="Loading deployment review"></lightning-spinner>
                        </template>

                        <template if:true={showDeploymentReviewCard}>
                            <lightning-card title="Deployment Review" class="slds-m-top_medium">
                                <div class="slds-p-around_medium">
                                    <template if:false={showDeploymentReviewContent}>
                                        <p class="slds-text-body_regular">
                                            Your deployment plan has been created. Click
                                            <strong>Review Deployment</strong>
                                            above to analyze the selected metadata, its dependencies, and any
                                            recommended test classes before validating your source.
                                        </p>
                                    </template>
                                    <template if:true={showDeploymentReviewContent}>
                                        <lightning-accordion allow-multiple-sections-open>
                                            <template for:each={deploymentReviewItems} for:item="item">
                                                <lightning-accordion-section
                                                    key={item.key}
                                                    name={item.key}
                                                    label={item.accordionLabel}>

                                                    <lightning-layout multiple-rows>
                                                        <lightning-layout-item
                                                            size="12"
                                                            medium-device-size="6"
                                                            padding="around-small">
                                                            <dl class="slds-dl_horizontal">
                                                                <dt class="slds-dl_horizontal__label">
                                                                    <p class="slds-truncate">Metadata Name</p>
                                                                </dt>
                                                                <dd class="slds-dl_horizontal__detail">
                                                                    <p class="slds-truncate">{item.displayMetadataName}</p>
                                                                </dd>
                                                                <dt class="slds-dl_horizontal__label">
                                                                    <p class="slds-truncate">Metadata Type</p>
                                                                </dt>
                                                                <dd class="slds-dl_horizontal__detail">
                                                                    <p class="slds-truncate">{item.metadataType}</p>
                                                                </dd>
                                                            </dl>
                                                        </lightning-layout-item>
                                                        <lightning-layout-item
                                                            size="12"
                                                            medium-device-size="6"
                                                            padding="around-small">
                                                            <dl class="slds-dl_horizontal">
                                                                <dt class="slds-dl_horizontal__label">
                                                                    <p class="slds-truncate">Review Status</p>
                                                                </dt>
                                                                <dd class="slds-dl_horizontal__detail">
                                                                    <span class={item.statusBadgeClass}>{item.status}</span>
                                                                </dd>
                                                                <dt class="slds-dl_horizontal__label">
                                                                    <p class="slds-truncate">API Version</p>
                                                                </dt>
                                                                <dd class="slds-dl_horizontal__detail">
                                                                    <p class="slds-truncate">{item.apiVersion}</p>
                                                                </dd>
                                                            </dl>
                                                        </lightning-layout-item>
                                                    </lightning-layout>

                                                    <div class="slds-m-top_medium">
                                                        <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                                                            Required Dependencies
                                                        </h3>
                                                        <lightning-datatable
                                                            key-field="id"
                                                            data={item.requiredDependencies}
                                                            columns={requiredDependencyColumns}
                                                            hide-checkbox-column>
                                                        </lightning-datatable>
                                                    </div>

                                                    <template if:true={item.hasRecommendedTestClasses}>
                                                        <div class="slds-m-top_medium">
                                                            <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                                                                Recommended Test Classes
                                                            </h3>
                                                            <template for:each={item.recommendedTestClasses} for:item="testClass">
                                                                <div key={testClass.id} class="slds-p-vertical_xx-small">
                                                                    <lightning-input
                                                                        type="checkbox"
                                                                        label={testClass.name}
                                                                        checked={testClass.selected}
                                                                        data-metadata={item.key}
                                                                        data-testclass={testClass.name}
                                                                        onchange={handleTestClassSelection}>
                                                                    </lightning-input>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </template>

                                                    <template if:true={item.hasOptionalDependencies}>
                                                        <div class="slds-m-top_medium">
                                                            <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                                                                Optional Dependencies
                                                            </h3>
                                                            <lightning-datatable
                                                                key-field="id"
                                                                data={item.optionalDependencies}
                                                                columns={optionalDependencyColumns}
                                                                hide-checkbox-column>
                                                            </lightning-datatable>
                                                        </div>
                                                    </template>

                                                </lightning-accordion-section>
                                            </template>
                                        </lightning-accordion>
                                    </template>
                                </div>
                                <div slot="footer" class="slds-text-align_right">
                                    <lightning-button
                                        label="Validate Source"
                                        variant="brand"
                                        onclick={handleValidateSource}
                                        disabled={isValidateSourceDisabled}>
                                    </lightning-button>
                                </div>
                            </lightning-card>
                        </template>

                        <template if:true={isLoadingSourceValidation}>
                            <lightning-spinner alternative-text="Running source validation"></lightning-spinner>
                        </template>

                        <template if:true={showSourceValidationCard}>
                            <lightning-card title="Source Validation" class="slds-m-top_medium">
                                <div class="slds-p-around_medium">
                                    <lightning-layout multiple-rows class="slds-m-bottom_medium">
                                        <lightning-layout-item
                                            size="12"
                                            medium-device-size="4"
                                            padding="around-small">
                                            <dl class="slds-dl_horizontal">
                                                <dt class="slds-dl_horizontal__label">
                                                    <p class="slds-truncate">Overall Validation</p>
                                                </dt>
                                                <dd class="slds-dl_horizontal__detail">
                                                    <span class={overallSourceValidationBadgeClass}>
                                                        {overallSourceValidationStatus}
                                                    </span>
                                                </dd>
                                            </dl>
                                        </lightning-layout-item>
                                        <lightning-layout-item
                                            size="12"
                                            medium-device-size="4"
                                            padding="around-small">
                                            <dl class="slds-dl_horizontal">
                                                <dt class="slds-dl_horizontal__label">
                                                    <p class="slds-truncate">Quality Gate</p>
                                                </dt>
                                                <dd class="slds-dl_horizontal__detail">
                                                    <span class={sourceValidationQualityGateBadgeClass}>
                                                        {sourceValidationQualityGate}
                                                    </span>
                                                </dd>
                                            </dl>
                                        </lightning-layout-item>
                                        <lightning-layout-item
                                            size="12"
                                            medium-device-size="4"
                                            padding="around-small">
                                            <dl class="slds-dl_horizontal">
                                                <dt class="slds-dl_horizontal__label">
                                                    <p class="slds-truncate">Execution Time</p>
                                                </dt>
                                                <dd class="slds-dl_horizontal__detail">
                                                    <p class="slds-truncate">{sourceValidationExecutionTime}</p>
                                                </dd>
                                            </dl>
                                        </lightning-layout-item>
                                    </lightning-layout>

                                    <template if:true={showSourceValidationContinueHint}>
                                        <div class="stage-validation-continue-hint" role="status">
                                            {sourceValidationContinueMessage}
                                        </div>
                                    </template>

                                    <lightning-accordion allow-multiple-sections-open>
                                        <template for:each={sourceValidationDisplayItems} for:item="item">
                                            <lightning-accordion-section
                                                key={item.key}
                                                name={item.key}
                                                label={item.accordionLabel}>

                                                <lightning-layout multiple-rows>
                                                    <lightning-layout-item
                                                        size="12"
                                                        medium-device-size="6"
                                                        padding="around-small">
                                                        <dl class="slds-dl_horizontal">
                                                            <dt class="slds-dl_horizontal__label">
                                                                <p class="slds-truncate">Metadata Name</p>
                                                            </dt>
                                                            <dd class="slds-dl_horizontal__detail">
                                                                <p class="slds-truncate">{item.displayMetadataName}</p>
                                                            </dd>
                                                        </dl>
                                                    </lightning-layout-item>
                                                    <lightning-layout-item
                                                        size="12"
                                                        medium-device-size="6"
                                                        padding="around-small">
                                                        <dl class="slds-dl_horizontal">
                                                            <dt class="slds-dl_horizontal__label">
                                                                <p class="slds-truncate">Overall Status</p>
                                                            </dt>
                                                            <dd class="slds-dl_horizontal__detail">
                                                                <span class={item.overallStatusBadgeClass}>
                                                                    {item.overallStatus}
                                                                </span>
                                                            </dd>
                                                        </dl>
                                                    </lightning-layout-item>
                                                </lightning-layout>

                                                <template if:true={item.hasTestExecution}>
                                                    <div class="slds-m-top_medium">
                                                        <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                                                            Test Execution
                                                        </h3>
                                                        <lightning-datatable
                                                            key-field="id"
                                                            data={item.testExecutionRows}
                                                            columns={testExecutionColumns}
                                                            hide-checkbox-column>
                                                        </lightning-datatable>
                                                    </div>
                                                </template>

                                                <template if:true={item.hasCoverage}>
                                                    <div class="slds-m-top_medium">
                                                        <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                                                            Code Coverage
                                                        </h3>
                                                        <lightning-datatable
                                                            key-field="apexClass"
                                                            data={item.coverageTableData}
                                                            columns={coverageColumns}
                                                            hide-checkbox-column>
                                                        </lightning-datatable>
                                                    </div>
                                                </template>

                                            </lightning-accordion-section>
                                        </template>
                                    </lightning-accordion>
                                </div>
                            </lightning-card>
                        </template>


                        </template>
                        <!-- /selectedComparisonDetails inside Stage 4 -->

                    </template>

                    <template if:true={isStage5Workspace}>

                        <div class="stage5-console">
                        <p class="lifecycle-rail-label stage5-console-kicker">Stage 5 of 6 · Deployment Control</p>
                        <p class="stage5-console-lead">
                            Validate the destination, understand results, resolve issues, plan what deploys,
                            then confirm readiness before execution.
                        </p>

                        <!-- PHASE 4 — Deployment Validation workspace (relocated HTML only) -->
                        <template if:true={selectedComparisonDetails}>

                        <div class="section-card stage5-command-bar">
                            <div class="section-card-header results-card-header stage5-command-bar__inner">
                                <div class="stage5-command-bar__copy">
                                    <span class="stage5-eyebrow">Deployment Validation</span>
                                    <span class="section-card-title stage5-command-title">Validate destination &amp; package</span>
                                    <p class="stage5-command-sub">
                                        Confirm connectivity, metadata, and dependencies before planning deployment.
                                    </p>
                                </div>
                                <lightning-button
                                    label="Validate Deployment"
                                    variant="brand"
                                    onclick={handleValidateDeployment}
                                    disabled={isValidateDeploymentDisabled}
                                    class="stage5-command-action">
                                </lightning-button>
                            </div>
                        </div>

                        <!-- Validation progress is rendered by the full-workspace
                             operation overlay at the end of this template. -->

                        <template if:true={showDeploymentValidationCard}>
                            <lightning-card title="Deployment Validation" class="slds-m-top_medium stage5-validation-card">
                                <div class="slds-p-around_medium stage5-validation-body">

                                    <div class="stage5-panel stage5-panel_connectivity slds-m-bottom_medium">
                                        <div class="stage5-section-header">
                                            <div class="stage5-section-header__text">
                                                <h3 class="stage5-section-title">Destination Connectivity</h3>
                                                <p class="stage5-section-sub">Authentication status for the destination org</p>
                                            </div>
                                        </div>
                                        <div class="stage5-status-card">
                                            <div class="stage5-status-card__row">
                                                <span class="stage5-status-card__label">Connection status</span>
                                                <span class={deploymentValidationDisplay.destinationConnectivity.statusBadgeClass}>
                                                    {deploymentValidationDisplay.destinationConnectivity.status}
                                                </span>
                                            </div>
                                            <p class="stage5-status-card__message">
                                                {deploymentValidationDisplay.destinationConnectivity.message}
                                            </p>
                                        </div>
                                    </div>

                                    <!-- Pinned overview — Enterprise Deployment Summary (single rendered source) -->
                                    <template if:true={showDeploymentIntelligence}>
                                        <template if:true={deploymentIntelligenceDisplay.hasEnterprise}>
                                            <div class="deployment-intelligence-report stage5-intelligence slds-m-bottom_medium" aria-label="Enterprise Deployment Intelligence">
                                                <div class="readiness-section stage5-panel stage5-panel_summary">
                                                    <div class="readiness-report-header stage5-section-header">
                                                        <div class="stage5-section-header__text">
                                                            <h3 class="stage5-section-title">Enterprise Deployment Summary</h3>
                                                            <p class="stage5-section-sub">Aggregated validation outcomes for this run</p>
                                                        </div>
                                                        <template if:true={deploymentIntelligenceDisplay.overallStatus}>
                                                            <span class={deploymentIntelligenceDisplay.overallStatusBadgeClass}>
                                                                {deploymentIntelligenceDisplay.overallStatus}
                                                            </span>
                                                        </template>
                                                    </div>
                                                    <template if:true={deploymentIntelligenceDisplay.generatedAt}>
                                                        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                                                            Generated at {deploymentIntelligenceDisplay.generatedAt}
                                                            <template if:true={deploymentIntelligenceDisplay.executionMode}>
                                                                · Mode: {deploymentIntelligenceDisplay.executionMode}
                                                            </template>
                                                        </p>
                                                    </template>
                                                    <template if:true={deploymentIntelligenceDisplay.hasSummaryMetrics}>
                                                        <div class="readiness-kpi-grid intel-kpi-grid stage5-kpi-grid">
                                                            <template for:each={deploymentIntelligenceDisplay.summaryMetrics} for:item="metric">
                                                                <div key={metric.id} class="readiness-kpi-card stage5-kpi-card">
                                                                    <span class="readiness-kpi-label">{metric.label}</span>
                                                                    <span class="readiness-kpi-value">{metric.value}</span>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </template>

                                    <div class="stage5-decision-action">
                                        <lightning-button
                                            label="Ready for Deployment"
                                            variant="brand"
                                            onclick={handleReadinessReportDeploy}
                                            disabled={isReadyForDeploymentCtaDisabled}
                                            class="stage5-primary-cta">
                                        </lightning-button>
                                    </div>

                                    <!-- Validation Details — presentation-only tab navigation over existing sections -->
                                    <div class="stage5-details">
                                        <div class="stage5-details__header">
                                            <span class="stage5-eyebrow">Validation Details</span>
                                            <p class="stage5-details__sub">
                                                Review detailed validation outcomes and deployment readiness information.
                                            </p>
                                        </div>

                                        <template if:true={hasStage5Tabs}>
                                            <div class="stage5-tablist" role="tablist" aria-label="Validation details sections">
                                                <template for:each={stage5Tabs} for:item="tab">
                                                    <button
                                                        key={tab.id}
                                                        type="button"
                                                        role="tab"
                                                        class={tab.cssClass}
                                                        data-tab={tab.id}
                                                        aria-selected={tab.ariaSelected}
                                                        tabindex={tab.tabIndex}
                                                        onclick={handleStage5TabChange}>
                                                        {tab.label}
                                                    </button>
                                                </template>
                                            </div>
                                        </template>

                                        <div class="stage5-tab-body">

                                    <div
                                        class={stage5TabPanels.metadataValidation.cssClass}
                                        role="tabpanel"
                                        aria-hidden={stage5TabPanels.metadataValidation.ariaHidden}
                                        aria-label="Metadata Validation">
                                    <div class="stage5-panel slds-m-bottom_medium">
                                        <div class="stage5-section-header">
                                            <div class="stage5-section-header__text">
                                                <h3 class="stage5-section-title">Metadata Validation</h3>
                                                <p class="stage5-section-sub">Source metadata readiness for this deployment package</p>
                                            </div>
                                        </div>
                                        <template if:true={isMetadataValidationTab}>
                                            <template if:true={deploymentValidationDisplay.metadataValidation.hasRows}>
                                                <div class="stage5-table-shell">
                                                    <lightning-datatable
                                                        key-field="id"
                                                        data={deploymentValidationDisplay.metadataValidation.rows}
                                                        columns={metadataValidationColumns}
                                                        hide-checkbox-column>
                                                    </lightning-datatable>
                                                </div>
                                            </template>
                                        </template>
                                    </div>
                                    </div>

                                    <div
                                        class={stage5TabPanels.dependencyValidation.cssClass}
                                        role="tabpanel"
                                        aria-hidden={stage5TabPanels.dependencyValidation.ariaHidden}
                                        aria-label="Dependency Validation">
                                    <div class="stage5-panel slds-m-bottom_medium">
                                        <div class="stage5-section-header">
                                            <div class="stage5-section-header__text">
                                                <h3 class="stage5-section-title">Dependency Validation</h3>
                                                <p class="stage5-section-sub">Dependencies required for deployment</p>
                                            </div>
                                            <template if:true={deploymentValidationDisplay.dependencyValidation.hasRows}>
                                                <span class="stage5-count-chip">
                                                    {deploymentValidationDisplay.dependencyValidation.rows.length} dependencies
                                                </span>
                                            </template>
                                        </div>
                                        <template if:true={deploymentValidationDisplay.dependencyValidation.hasRows}>
                                            <div class="stage5-dependency-scroll" role="region" aria-label="Dependency Validation results">
                                                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout">
                                                    <thead>
                                                        <tr class="slds-line-height_reset">
                                                            <th scope="col">
                                                                <div class="slds-truncate" title="Dependency">Dependency</div>
                                                            </th>
                                                            <th scope="col">
                                                                <div class="slds-truncate" title="Exists">Exists</div>
                                                            </th>
                                                            <th scope="col">
                                                                <div class="slds-truncate" title="Included in Deployment">Included in Deployment</div>
                                                            </th>
                                                            <th scope="col">
                                                                <div class="slds-truncate" title="Status">Status</div>
                                                            </th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <template for:each={deploymentValidationDisplay.dependencyValidation.rows} for:item="row">
                                                            <tr key={row.id} class="slds-hint-parent">
                                                                <td>
                                                                    <div class="slds-truncate" title={row.name}>{row.name}</div>
                                                                </td>
                                                                <td>
                                                                    <span class={row.existsBadgeClass}>{row.existsLabel}</span>
                                                                </td>
                                                                <td>
                                                                    <div class="slds-truncate" title={row.includedLabel}>{row.includedLabel}</div>
                                                                </td>
                                                                <td>
                                                                    <div class="slds-truncate" title={row.status}>{row.status}</div>
                                                                </td>
                                                            </tr>
                                                        </template>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </template>
                                    </div>
                                    </div>

                                    <template if:true={showDeploymentIntelligence}>

                                        <div
                                            class={stage5TabPanels.failureResolution.cssClass}
                                            role="tabpanel"
                                            aria-hidden={stage5TabPanels.failureResolution.ariaHidden}
                                            aria-label="Failure Analysis and Resolution">
                                            <div class="readiness-section stage5-panel stage5-collapsible">
                                                <div class="stage5-collapse-header">
                                                    <button
                                                        type="button"
                                                        class="stage5-collapse-toggle"
                                                        aria-expanded={isFailureAnalysisExpanded}
                                                        aria-controls="stage5-failure-analysis-body"
                                                        onclick={toggleFailureAnalysis}>
                                                        <lightning-icon
                                                            icon-name={failureAnalysisChevron}
                                                            size="x-small"
                                                            alternative-text=""
                                                            class="stage5-collapse-chevron">
                                                        </lightning-icon>
                                                        <span class="stage5-collapse-toggle__copy">
                                                            <span class="stage5-section-title stage5-section-title_h4">Failure Analysis</span>
                                                            <span class="stage5-section-sub">Issues requiring attention</span>
                                                        </span>
                                                    </button>
                                                    <template if:true={showReportIssueButton}>
                                                        <lightning-button
                                                            label="Report Issue"
                                                            variant="neutral"
                                                            onclick={handleReportIssue}
                                                            title="Generate a sanitized Support Bundle for download">
                                                        </lightning-button>
                                                    </template>
                                                </div>
                                                <div
                                                    id="stage5-failure-analysis-body"
                                                    class={failureAnalysisBodyClass}>
                                                    <template if:true={deploymentIntelligenceDisplay.hasFailures}>
                                                        <div class="slds-scrollable_x stage5-table-shell">
                                                            <table class="slds-table slds-table_cell-buffer slds-table_bordered readiness-table stage5-data-table" role="grid">
                                                                <thead>
                                                                    <tr class="slds-line-height_reset">
                                                                        <th scope="col"><div class="slds-truncate" title="Metadata Type">Metadata Type</div></th>
                                                                        <th scope="col"><div class="slds-truncate" title="Metadata Name">Metadata Name</div></th>
                                                                        <th scope="col"><div class="slds-truncate" title="Category">Category / Severity</div></th>
                                                                        <th scope="col"><div class="slds-truncate" title="Reason">Reason</div></th>
                                                                    </tr>
                                                                </thead>
                                                                <tbody>
                                                                    <template for:each={deploymentIntelligenceDisplay.failureRows} for:item="row">
                                                                        <tr key={row.id} class="slds-hint-parent">
                                                                            <td><div class="slds-truncate" title={row.metadataType}>{row.metadataType}</div></td>
                                                                            <td><div class="slds-truncate" title={row.metadataName}>{row.metadataName}</div></td>
                                                                            <td><div class="slds-truncate" title={row.category}>{row.category}</div></td>
                                                                            <td><div class="slds-truncate" title={row.reason}>{row.reason}</div></td>
                                                                        </tr>
                                                                    </template>
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                    </template>
                                                    <template if:false={deploymentIntelligenceDisplay.hasFailures}>
                                                        <p class="stage5-empty-state">No deployment failures detected.</p>
                                                    </template>
                                                </div>
                                            </div>

                                            <div class="readiness-section stage5-panel stage5-collapsible">
                                                <div class="stage5-collapse-header">
                                                    <button
                                                        type="button"
                                                        class="stage5-collapse-toggle"
                                                        aria-expanded={isResolutionNextActionsExpanded}
                                                        aria-controls="stage5-resolution-body"
                                                        onclick={toggleResolutionNextActions}>
                                                        <lightning-icon
                                                            icon-name={resolutionNextActionsChevron}
                                                            size="x-small"
                                                            alternative-text=""
                                                            class="stage5-collapse-chevron">
                                                        </lightning-icon>
                                                        <span class="stage5-collapse-toggle__copy">
                                                            <span class="stage5-section-title stage5-section-title_h4">Resolution / Next Actions</span>
                                                            <span class="stage5-section-sub">Recommended remediation steps</span>
                                                        </span>
                                                    </button>
                                                </div>
                                                <div
                                                    id="stage5-resolution-body"
                                                    class={resolutionNextActionsBodyClass}>
                                                    <template if:true={deploymentIntelligenceDisplay.hasNextActions}>
                                                        <div class="slds-scrollable_x stage5-table-shell">
                                                            <table class="slds-table slds-table_cell-buffer slds-table_bordered readiness-table stage5-data-table" role="grid">
                                                                <thead>
                                                                    <tr class="slds-line-height_reset">
                                                                        <th scope="col"><div class="slds-truncate" title="Priority">Priority</div></th>
                                                                        <th scope="col"><div class="slds-truncate" title="Type">Type</div></th>
                                                                        <th scope="col"><div class="slds-truncate" title="Metadata">Metadata</div></th>
                                                                        <th scope="col"><div class="slds-truncate" title="Message">Message</div></th>
                                                                        <th scope="col"><div class="slds-truncate" title="Status">Status</div></th>
                                                                    </tr>
                                                                </thead>

                                                                    <th scope="col"><div class="slds-truncate" title="Category">Category</div></th>

                                                                <template for:each={deploymentReadinessReport.excludedRows} for:item="row">

                                                            <thead>
                                                                <tr class="slds-line-height_reset">

                                            <div class="slds-m-top_medium slds-is-relative ai-advisor-loading">

                                                </p>
                                            </div>

                                            <lightning-card class="slds-m-top_medium ai-advisor-card stage5-panel_advisor">

                                                            <span class="slds-assistive-text">Warning</span>
                                                            <h3 class="slds-text-heading_small">AI Advisor unavailable</h3>

                                                                Advisor Status: {aiAdvisorDisplay.advisorStatus}

                                                            <span class={aiAdvisorGroundingBadgeClass}>
                                                                Grounding Score: {aiAdvisorDisplay.groundingScore}
                                                            </span>
                                                        </div>

                                                        <p class="slds-text-body_small slds-m-bottom_medium">
                                                            {aiAdvisorDisplay.statusMessage}

                                                            <div class="slds-m-bottom_medium">
                                                                <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                                                                    Executive Summary
                                                                </h3>
                                                                <p class="ai-advisor-text">{aiAdvisorDisplay.executiveSummary}</p>
                                                            </div>

                                                            <div class="slds-m-bottom_medium">
                                                                <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                                                                    Developer Summary
                                                                </h3>
                                                                <p class="ai-advisor-text">{aiAdvisorDisplay.developerSummary}</p>
                                                            </div>

                                                            <div class="slds-m-bottom_medium">
                                                                <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                                                                    Risk Analysis
                                                                </h3>
                                                                <template if:true={hasAiAdvisorRiskItems}>
                                                                    <ul class="slds-list_dotted">
                                                                        <template for:each={aiAdvisorRiskItems} for:item="item">
                                                                            <li key={item.id}>{item.text}</li>
                                                                        </template>
                                                                    </ul>
                                                                </template>
                                                                <template if:false={hasAiAdvisorRiskItems}>
                                                                    <p class="slds-text-body_small slds-text-color_weak">No risks were identified for this deployment.</p>

                                                            <div class="slds-m-bottom_medium">
                                                                <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                                                                    Deployment Recommendations
                                                                </h3>

                                                                    <ul class="slds-list_dotted">
                                                                        <template for:each={aiAdvisorRecommendations} for:item="item">
                                                                            <li key={item.id}>{item.text}</li>
                                                                        </template>
                                                                    </ul>
                                                                </template>
                                                                <template if:false={hasAiAdvisorRecommendations}>
                                                                    <p class="slds-text-body_small slds-text-color_weak">No additional recommendations for this deployment.</p>

                                                            </div>
                                                        </template>

                                                        <template if:true={showAiAdvisorStatusOnly}>
                                                            <p class="slds-text-body_regular slds-text-color_weak">

                                                                <pre class="ai-advisor-diagnostics">{aiAdvisorDiagnosticsJson}</pre>
                                                            </div>
                                                        </template>
                                                    </template>
                                                </div>
                                            </lightning-card>
                                        </template>

                                    </div>

                                        </div>

                                    </div>

                    <template if:true={isStage6Workspace}>

                            </div>

            <!-- Deploy Confirmation Modal -->

                                <dt class="slds-dl_horizontal__label">
                                    <p class="slds-truncate">Deployment Mode</p>
                                </dt>
                                <dd class="slds-dl_horizontal__detail">DEPLOY</dd>

                                <dt class="slds-dl_horizontal__label">
                                    <p class="slds-truncate">Metadata Selected</p>
                                </dt>
                                <dd class="slds-dl_horizontal__detail">{deployConfirmMetadataCount}</dd>

                                <dt class="slds-dl_horizontal__label">
                                    <p class="slds-truncate">Dependencies</p>
